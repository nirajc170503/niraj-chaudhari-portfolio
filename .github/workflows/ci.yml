name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the run in progress, so a sequence of
# pushes does not queue up several identical builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  verify:
    name: Runtime checks
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # scripts/verify.mjs drives a real browser, so it needs one. A matching
      # Chrome for Testing is installed rather than relying on whatever the
      # runner image happens to ship.
      - name: Install Chrome for Testing
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Start the preview server
        run: |
          npm run preview &
          # Poll rather than pulling in a wait-on dependency for one CI step.
          node -e '
            const wait = async () => {
              for (let i = 0; i < 60; i++) {
                try {
                  const r = await fetch("http://localhost:4173", { signal: AbortSignal.timeout(2000) })
                  if (r.ok) return
                } catch { /* not up yet */ }
                await new Promise((r) => setTimeout(r, 500))
              }
              throw new Error("preview server did not come up")
            }
            wait().then(() => console.log("preview server is up"))
          '

      - name: Verify every route in a real browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run verify -- http://localhost:4173

      - name: Check layout across viewports
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:layout -- http://localhost:4173
